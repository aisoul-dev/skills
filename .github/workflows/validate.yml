name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate plugins
        run: |
          for p in plugins/*/; do
            claude plugin validate "$p"
          done

      - name: Shellcheck
        run: shellcheck -x plugins/*/scripts/*/*.sh tests/*.sh

      - name: Smoke tests
        run: |
          bash tests/smoke.sh
          bash tests/pr.sh
          bash tests/pr-risk.sh
          bash tests/pr-review.sh

      - name: No em dashes in skills and docs
        run: |
          em="$(printf '\xe2\x80\x94')"
          if grep -rn "$em" --include='*.md' --include='*.json' --include='*.sh' --include='*.cjs' .; then
            echo "Em dash found, use a hyphen or en dash instead"; exit 1
          fi

      - name: No variable glued to a non-ASCII character in scripts
        run: |
          if grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' plugins/*/scripts tests; then
            echo 'Use ${name} before a non-ASCII character: under LC_CTYPE=C bash reads it as part of the name'; exit 1
          fi

      - name: Version bumped for changed plugins
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          status=0
          for p in plugins/*/; do
            name="$(basename "$p")"
            if ! git diff --quiet "origin/${{ github.base_ref }}" -- "$p"; then
              if git diff --quiet "origin/${{ github.base_ref }}" -- "$p.claude-plugin/plugin.json"; then
                echo "::error::$name changed without a version bump in plugin.json"; status=1
              fi
            fi
          done
          exit $status
